[project]
name = "tana"
version = "0.1.0"
description = "Tana: an all-in-one AI assistant web app with voice, swappable agent backends and plugins"
license = "Apache-2.0"
authors = [{ name = "Prog-Ramen" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.10",
    "numpy>=1.26",
    "opuslib>=3.0.1",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "soxr>=0.5",
    "pyyaml>=6",
    "onnxruntime>=1.19",
    "anthropic>=1.8.0",
    "argon2-cffi>=25.1.0",
    "pyotp>=2.10.0",
    "qrcode>=7.4",
]

[project.scripts]
tana = "tana.app:main"
tana-admin = "tana.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tana"]
